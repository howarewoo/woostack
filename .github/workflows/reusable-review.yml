name: Parallel AI Review
on:
  workflow_call:
    inputs:
      provider:
        description: 'Explicit provider: anthropic | openai | google | openrouter.'
        type: string
        required: false
      model:
        description: 'Model identifier passed to the chosen runner.'
        type: string
        required: false
      force_tier:
        description: 'Optional one-run tier override: fast | deep.'
        type: string
        required: false
      openai_effort:
        description: 'Optional OpenAI Codex reasoning_effort override. Empty uses the tier default.'
        type: string
        required: false
      trigger_phrase:
        description: 'Phrase that triggers a review when posted in a PR comment.'
        type: string
        required: false
        default: '@review'
      max_turns:
        description: 'Maximum agent turns.'
        type: string
        required: false
        default: '30'
      skip_labels:
        description: 'Comma-separated list of PR labels that force-skip the review.'
        type: string
        required: false
      prompt_override:
        description: 'Optional path (relative to the consumer repo) to a custom prompt.'
        type: string
        required: false
      disable_angles:
        description: 'Comma-separated list of review angles to skip.'
        type: string
        required: false
      impeccable_version:
        description: 'npm version of impeccable CLI to invoke.'
        type: string
        required: false
        default: 'latest'
      incremental:
        description: 'Review scope: auto (re-use prior SHA marker, diff new commits only) or off (full PR diff). PR-comment `--full` overrides to off.'
        type: string
        required: false
        default: 'auto'
    secrets:
      anthropic_token:
        required: false
      anthropic_api_key:
        required: false
      openai_api_key:
        required: false
      google_api_key:
        required: false
      gemini_api_key:
        required: false
      openrouter_api_key:
        required: false

# Cancel superseded runs on the same PR so rapid pushes do not queue parallel
# expensive AI passes.
concurrency:
  group: woostack-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      angles: ${{ steps.woo.outputs.angles_json }}
      chunks: ${{ steps.woo.outputs.chunks_json }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 1
      # Self-references pinned to the reviewed action commit. Bump in lockstep with releases.
      - id: woo
        uses: howarewoo/woostack@a3dcbe88ad7606d722231646c7efc4fa2d6f737f
        with:
          mode: detect
          disable_angles: ${{ inputs.disable_angles }}
          incremental: ${{ inputs.incremental }}
          force_tier: ${{ inputs.force_tier }}
      # The uploaded tree is deliberately diff-only advisory evidence. It contains
      # the exact PR trailer candidate, but no authoritative remote artifact or provider issue context.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-artifacts
          path: /tmp/pr-review/
          retention-days: 1
          include-hidden-files: true
      - name: Remove local review artifacts
        if: always()
        shell: bash
        run: rm -rf /tmp/pr-review

  review:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: needs.detect.outputs.angles != '[]' && needs.detect.outputs.angles != ''
    # Two-dim matrix (issue #14): angles × chunks. When chunking does not
    # activate, `chunks` is `[""]` and the matrix collapses to one job per
    # angle (current behaviour, zero overhead). When it activates,
    # `chunks` is `["chunk-0", "chunk-1", ...]` and the matrix fans out as
    # angles × chunks so each worker stays inside the model context window.
    strategy:
      fail-fast: false
      matrix:
        angle: ${{ fromJson(needs.detect.outputs.angles) }}
        chunk: ${{ fromJson(needs.detect.outputs.chunks) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download base artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: review-artifacts
          path: /tmp/pr-review/
      # One-retry wrapper: a transient angle failure (model timeout, rate limit) gets
      # one re-run before the receipt gate fails the review, mirroring the local swarm's
      # single retry. Dependency-free — a duplicated action step, no third-party retry action.
      - name: Run angle review (attempt 1)
        id: review1
        continue-on-error: true
        uses: howarewoo/woostack@a3dcbe88ad7606d722231646c7efc4fa2d6f737f
        with:
          mode: review
          angle: ${{ matrix.angle }}
          chunk: ${{ matrix.chunk }}
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          force_tier: ${{ inputs.force_tier }}
          openai_effort: ${{ inputs.openai_effort }}
          anthropic_token: ${{ secrets.anthropic_token }}
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          openai_api_key: ${{ secrets.openai_api_key }}
          google_api_key: ${{ secrets.google_api_key }}
          gemini_api_key: ${{ secrets.gemini_api_key }}
          openrouter_api_key: ${{ secrets.openrouter_api_key }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          max_turns: ${{ inputs.max_turns }}
          skip_labels: ${{ inputs.skip_labels }}
          prompt_override: ${{ inputs.prompt_override }}
          impeccable_version: ${{ inputs.impeccable_version }}
      - name: Run angle review (retry once)
        if: steps.review1.outcome == 'failure'
        uses: howarewoo/woostack@a3dcbe88ad7606d722231646c7efc4fa2d6f737f
        with:
          mode: review
          angle: ${{ matrix.angle }}
          chunk: ${{ matrix.chunk }}
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          force_tier: ${{ inputs.force_tier }}
          openai_effort: ${{ inputs.openai_effort }}
          anthropic_token: ${{ secrets.anthropic_token }}
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          openai_api_key: ${{ secrets.openai_api_key }}
          google_api_key: ${{ secrets.google_api_key }}
          gemini_api_key: ${{ secrets.gemini_api_key }}
          openrouter_api_key: ${{ secrets.openrouter_api_key }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          max_turns: ${{ inputs.max_turns }}
          skip_labels: ${{ inputs.skip_labels }}
          prompt_override: ${{ inputs.prompt_override }}
          impeccable_version: ${{ inputs.impeccable_version }}
      # Artifact name includes the chunk suffix so multiple chunk jobs for the
      # same angle cannot collide on upload. `chunk` is `""` in the un-chunked
      # case → suffix collapses to `-all`; the merge step globs `findings-*`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-${{ matrix.angle }}-${{ matrix.chunk || 'all' }}
          # Receipts ride alongside findings in the same artifact so the validate
          # job's `pattern: findings-*` + merge-multiple download picks them up,
          # and verify-receipts.sh can prove each angle actually executed.
          path: |
            /tmp/pr-review/findings.${{ matrix.angle }}*.json
            /tmp/pr-review/receipt.${{ matrix.angle }}*.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Remove local angle artifacts
        if: always()
        shell: bash
        run: rm -rf /tmp/pr-review

  validate:
    needs: [detect, review]
    # Adjudicator runs on partial review failures too — fail-fast is off so a single
    # angle failure must not prevent posting findings from the angles that did succeed.
    # Only skip if detection failed/cancelled or the whole run was cancelled.
    if: always() && needs.detect.result == 'success' && needs.review.result != 'cancelled'
    runs-on: ubuntu-latest
    # `contents: read` is sufficient — the adjudicator runs the LLM step against
    # untrusted PR content and never writes the repo. It only needs to post the
    # review (`pull-requests: write`).
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download base artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: review-artifacts
          path: /tmp/pr-review/
      - name: Download findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          pattern: findings-*
          path: /tmp/pr-review/
          merge-multiple: true

      # The single validation action receives every angle finding and receipt,
      # verifies coverage and the adjudicator receipt, then deterministically
      # finalizes and posts the one native GitHub Review.
      - name: Validate (adjudicate + finalize + post)
        uses: howarewoo/woostack@a3dcbe88ad7606d722231646c7efc4fa2d6f737f
        with:
          mode: validate
          disable_angles: ${{ inputs.disable_angles }}
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          force_tier: ${{ inputs.force_tier }}
          openai_effort: ${{ inputs.openai_effort }}
          anthropic_token: ${{ secrets.anthropic_token }}
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          openai_api_key: ${{ secrets.openai_api_key }}
          google_api_key: ${{ secrets.google_api_key }}
          gemini_api_key: ${{ secrets.gemini_api_key }}
          openrouter_api_key: ${{ secrets.openrouter_api_key }}
          max_turns: ${{ inputs.max_turns }}
          skip_labels: ${{ inputs.skip_labels }}
          prompt_override: ${{ inputs.prompt_override }}

      - name: Upload validator metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validator-metrics
          path: |
            /tmp/pr-review/validator-metrics.json
            /tmp/pr-review/findings.metrics.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove local validator artifacts
        if: always()
        shell: bash
        run: rm -rf /tmp/pr-review
