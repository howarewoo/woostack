name: Spec Issue
description: Report incorrect skill guidance, a broken workflow step, or an outdated constraint.
labels: ["spec-issue"]
body:
  - type: dropdown
    id: section
    attributes:
      label: Affected spec section
      options:
        - skills/woostack-execute/SKILL.md
        - skills/woostack-execute/references/patterns.md
        - skills/woostack-execute/references/infrastructure.md
        - skills/woostack-plan/SKILL.md
        - skills/woostack-init/SKILL.md
        - README.md
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      description: What does the spec say, and what should it say instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Did you hit this while creating a project, changing existing code, or reading the guidance?
    validations:
      required: false
