query WoostackPreflight {
  viewer {
    id
    active
    name
    organization {
      id
      name
      urlKey
    }
  }
  teams(first: 250) {
    nodes {
      id
      key
      name
      organization {
        id
        name
        urlKey
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  projectStatuses(first: 250) {
    nodes {
      id
      name
      type
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  workflowStates(first: 250) {
    nodes {
      id
      name
      type
      team {
        id
        key
        name
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  mutationCapabilities: __type(name: "Mutation") {
    fields {
      name
    }
  }
}

# The preflight consumer requires these Mutation fields before its first write:
# projectCreate, projectUpdate, documentCreate, documentUpdate,
# issueCreate, issueUpdate, and issueRelationCreate.
