query WoostackIssueList($projectId: ID!, $after: String) {
  issues(filter: { project: { id: { eq: $projectId } } }, first: 50, after: $after) {
    nodes {
      id
      identifier
      title
      description
      url
      updatedAt
      canceledAt
      archivedAt
      project { id }
      state { id }
      relations(first: 50) {
        nodes {
          id
          type
          relatedIssue { id project { id } }
        }
        pageInfo { hasNextPage endCursor }
      }
      inverseRelations(first: 50) {
        nodes {
          id
          type
          issue { id project { id } }
        }
        pageInfo { hasNextPage endCursor }
      }
      attachments(first: 50) {
        nodes { url }
        pageInfo { hasNextPage }
      }
    }
    pageInfo { hasNextPage endCursor }
  }
}
