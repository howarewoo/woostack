query WoostackIssueRelations($issueId: String!, $relationsAfter: String, $inverseRelationsAfter: String) {
  issue(id: $issueId) {
    id
    project { id }
    relations(first: 50, after: $relationsAfter) {
      nodes {
        id
        type
        relatedIssue { id project { id } }
      }
      pageInfo { hasNextPage endCursor }
    }
    inverseRelations(first: 50, after: $inverseRelationsAfter) {
      nodes {
        id
        type
        issue { id project { id } }
      }
      pageInfo { hasNextPage endCursor }
    }
  }
}
